name: Hash final comment on close

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  hash-comment:
    if: contains(github.event.issue.labels.*.name, 'ai-qa')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const MARKER = '<!-- ai-qa-close-hash -->';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            // Skip this workflow's own earlier hash comments (e.g. after a reopen and re-close).
            const isOwn = c => c.user.login === 'github-actions[bot]' && (c.body || '').startsWith(MARKER);
            const candidates = comments.filter(c => !isOwn(c));
            const last = candidates[candidates.length - 1];
            if (!last) {
              core.info('No comments to hash.');
              return;
            }

            const hash = crypto.createHash('sha256').update(last.body || '', 'utf8').digest('hex');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                MARKER,
                `🔒 Final comment hash (SHA-256, first 8): \`${hash.slice(0, 8)}\``,
                '',
                `Hashed comment: ${last.html_url} by ${last.user.login}, last updated ${last.updated_at}`,
                `Full hash: \`${hash}\``,
              ].join('\n'),
            });
